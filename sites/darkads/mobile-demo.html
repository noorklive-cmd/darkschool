<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>DarkAds — demonstração mobile</title>
  <style>
    *{box-sizing:border-box}html{background:#070707;color:#f5f5f5;font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 18%,rgba(197,22,38,.12),transparent 44%),#070707}.stage{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:16px;padding:14px}.top{width:min(100%,620px);display:flex;align-items:center;justify-content:space-between;color:#aaa;font:10px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.top b{color:#f4f4f4}.top a{color:#e5e5e5;text-decoration:underline;text-underline-offset:3px}.device{position:relative;align-self:center;width:min(414px,calc(100vw - 24px));height:min(852px,calc(100svh - 104px));min-height:580px;padding:10px;border:1px solid #444;border-radius:48px;background:linear-gradient(145deg,#242424,#070707 42%);box-shadow:0 36px 100px #000,0 0 0 5px #111,0 0 0 6px #343434;overflow:hidden}.viewport{width:100%;height:100%;overflow:hidden;border-radius:37px;background:#080808}.viewport iframe{display:block;width:100%;height:100%;border:0;background:#080808}.speaker{position:absolute;z-index:2;top:16px;left:50%;width:96px;height:22px;transform:translateX(-50%);border-radius:20px;background:#030303;pointer-events:none}.bottom{width:min(100%,620px);color:#777;font:10px ui-monospace,monospace;text-align:center}.bottom span{color:#c3c3c8}
    @media(max-width:500px){.stage{padding:10px;gap:10px}.top{font-size:9px}.device{width:calc(100vw - 20px);height:calc(100svh - 92px);min-height:540px;padding:8px;border-radius:39px}.viewport{border-radius:31px}.speaker{top:13px;width:82px;height:18px}.bottom{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="stage">
    <header class="top"><span><b>DARKADS</b> / MOBILE PREVIEW</span><a href="index.html">Abrir página</a></header>
    <div class="device" aria-label="Prévia responsiva da página DarkAds em viewport de telefone">
      <div class="speaker" aria-hidden="true"></div>
      <div class="viewport"><iframe src="index.html" title="Página DarkAds em viewport mobile" loading="eager"></iframe></div>
    </div>
    <footer class="bottom">PRÉVIA DA PÁGINA ATUAL · <span>ROLE O INTERIOR DO TELEFONE</span></footer>
  </main>
</body>
</html>
