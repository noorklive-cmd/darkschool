<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Botões Dark School</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #151515; color: #f5f5f5; }
    main { max-width: 38rem; margin-inline: auto; padding: 3rem 1.25rem; }
    nav { display: flex; flex-wrap: wrap; gap: .75rem; }
    .button {
      display: inline-flex; align-items: center; min-height: 44px;
      padding-inline: 1rem; border: 1px solid #888; border-radius: .75rem;
      color: inherit; font-weight: 650; text-decoration: none;
    }
    .button:hover { background: #303030; }
    .button--primary { background: #f5f5f5; border-color: #f5f5f5; color: #151515; }
    .button--primary:hover { background: #ddd; }
    .button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    section { margin-block-start: 3rem; }
  </style>
</head>
<body>
  <main>
    <h1>Botões Dark School</h1>
    <nav aria-label="Exemplos de chamada à ação">
      <a class="button button--primary" href="#avaliacao">Solicitar avaliação</a>
      <a class="button" href="#dark-tap">Conhecer o Dark Tap</a>
    </nav>
    <section id="avaliacao"><h2>Avaliação gratuita</h2><p>Exemplo de destino para a ação principal.</p></section>
    <section id="dark-tap"><h2>Dark Tap</h2><p>Exemplo de destino para a ação secundária.</p></section>
  </main>
</body>
</html>
